# Home Assistant "Energy" dashboard - the sidebar Energy entry, url_path
# energy-live. HA's own energy panel is HIDDEN from the sidebar (per-user
# frontend user_data: hiddenPanels ["energy"]); its config UI still lives at
# /config/energy. A storage dashboard's url_path must contain a hyphen, which
# is why it is "energy-live" and not "energy" - the sidebar label is what you
# actually read, and that says Energy.
#
# Applied live over websocket lovelace/config/save; this file is the record,
# not the source of truth - edit in HA, then re-export.
#
# HACS cards it needs: ReikanYsora/Helios, MindFreeze/ha-sankey-chart,
# selvalt7/modern-circular-gauge, dbuezas/lovelace-plotly-graph-card, card-mod.
# Card order is free: the Sankey was moved ABOVE the energy-date-selection card
# on 2026-08-27 and kept its data, so date-scoped cards do not have to follow
# it. (This file said they did until that was actually tried.)
#
# House-load split (2026-08-27): device_consumption carries Tesla and Air con,
# so the Energy dashboard's untracked remainder IS rest-of-house (checked
# 2026-08-26: derived 19.0 vs the inverter's own house_consumption_today 18.8 -
# BUT THAT COMPARISON IS WRONG, found 2026-08-27: recorded history shows
# house_consumption_today peaked at 17.7 on 2026-08-26 and never reached
# 18.8, so the sides are 1.3 apart, not 0.2. The remainder is UNVALIDATED
# until re-checked; sensor.solis_inverter_house_yesterday now makes that a
# one-line comparison).
# The Sankey gained a 4th column splitting House, and "Rest of house" is a
# remaining_parent_state node, so it needs no template sensor. The
# energy-devices-detail-graph / energy-devices-graph cards were tried here and
# REMOVED the same day - the owner wants the breakdown in the Sankey and
# nowhere else. Both card types do render, if one is ever wanted again.
#
# THE SANKEY'S SOURCE-TO-SINK SPLIT IS NOT MEASURED. The inverter publishes
# totals only - solar, import, battery in/out, export - and nothing that says
# which source fed which sink. The card allocates each source across whatever
# links it is given, IN THE ORDER THE LINKS ARE DECLARED. Verified 2026-08-27
# by moving Solar -> Battery in ahead of Solar -> House: solar stopped feeding
# the house first and started filling the battery. Two consequences. Order is
# an editorial choice about which story to tell, not a fact to preserve. And a
# link that is declared WILL be used, so a physically impossible one invents
# flow - Battery out -> Grid export was doing exactly that, showing the battery
# exporting on a house whose three discharge windows are all deliberately
# unset. It was deleted; export now comes only from solar.
#
# HOW THE ALLOCATOR ACTUALLY WORKS (ha-sankey-chart 6.3.0, read from the
# shipped bundle 2026-08-27 - there is no flow solver anywhere in it):
#
#     connection = min(source's unspent remainder, sink's unfilled remainder)
#
# walked per source node in NODE order, and within each source in LINK order.
# sort_by only moves boxes afterwards; it cannot change the solve. Two failure
# modes fall straight out of that, and both were live on this card:
#
#  1. A starved sink renders as a FLOATING BOX. _calcBoxes() draws a node from
#     its own sensor state, but the renderer filters out connections whose
#     state is 0. Solar was declared -> battery, -> house, -> export; house
#     (22 kWh) ate every remaining solar kWh, so solar -> export computed to
#     exactly 0 and Grid export sat there at 5.1 kWh with no ribbon reaching
#     it. It was never disconnected - it was allocated nothing.
#  2. remaining_parent_state IS NOT A BALANCE. Its state is
#     inbound.reduce((a,c) => c.ready ? a + c.state : Infinity, 0) - the sum of
#     what greedy failed to place upstream. That is why "Untracked / losses"
#     read 3.4 kWh on a day whose real residual was 0.1.
#
# Link order is therefore set by PHYSICS, not by taste: export FIRST, because
# solar is the only thing that can produce it (the battery cannot - discharge
# windows unset - and net grid import->export is not a thing), then battery in,
# then house as the elastic sink that absorbs the rest. Do not reorder these to
# make a prettier picture without re-checking that no sink starves.
#
# The residual node is no longer remaining_parent_state. It is a plain entity
# node with add_entities/subtract_entities, so it computes
# solar + import + battery_out - house - battery_in - export arithmetically
# instead of collecting greedy scraps; greedy then fills it via
# min(parentRemaining, thatValue), which makes it self-limiting - it can never
# display MORE than the true residual. Verified 2026-08-27 against the render:
# 16.3 + 14.0 + 4.4 = 34.7 in, 22.3 + 5.6 + 6.7 + 0.1 = 34.7 out. It also
# confirms add/subtract respect the Recorder `change` values that
# energy_date_selection swaps in, which could not be predicted from the source.
#
# Still true after all that: the source-to-sink split remains PRESENTATION.
# The ordering only makes the fabrication physically defensible. An honest
# alternative exists - funnel every source into one "Supply total" node and
# fan out from it, claiming no pairing at all - and was rejected because the
# whole point of this chart is seeing solar go to the battery.
#
# The Tesla figure comes from sensor.tesla_home_charging_energy, a left-Riemann
# integral (max_sub_interval 60s - TeslaMate publishes current ON CHANGE ONLY
# and a 32 A plateau went 80 minutes with no update) over a template sensor
# gating charger_voltage x charger_actual_current on a 180-280 V band. That is
# AC-side, so it reads ~6% ABOVE what the Tesla app reports: the app measures
# the pack, and the onboard charger's ~94%-efficiency losses are real house
# load. The band excludes Superchargers; it cannot tell home from another AC
# charger, which does not matter because the owner only charges at home.
# Neither device had statistics before 2026-08-27 - no backfill is possible.
# The LG sensor updates in HOURLY LUMPS (132 Wh flat for an hour, then a jump
# to 200), so a flat hour is the cloud poll cadence, not the AC being off.
#
# Helios notes (2026-08-27): weather-enabled is OFF deliberately - an overcast
# day paints a grey veil over the whole scene and flattens the 3D. Buildings
# need a high building-opacity against a custom palette or the extrusions
# vanish into the ground. camera-pitch-deg only wins when camera-locked is
# true; unlocked, a stored pose in the browser's localStorage takes priority.
title: Energy
path: energy
type: sections
max_columns: 4
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:helios-card
    map-theme-mode: custom
    auto-hide-ui: false
    auto-rotate-enabled: false
    camera-pitch-deg: 58
    show-timeline: true
    show-sun-times: true
    show-detail-panel: true
    show-cost: true
    shadows-enabled: true
    power-unit: kW
    energy-unit: auto
    value-decimals: 1
    max-expected-power: 9000
    battery-chip-mode: soc
    sun-chip-mode: irradiance
    weather-enabled: false
    weather-entity: weather.forecast_home_2
    grid_options:
      columns: full
      rows: 9
    camera-bearing-deg: 205
    display-radius: 250
    building-count: 100
    building-opacity: 0.92
    shadow-opacity: 0.5
    map-color-land: '#151a24'
    map-color-water: '#16344f'
    map-color-wood: '#1b2b1f'
    map-color-grass: '#1f3324'
    map-color-landuse: '#181d28'
    map-color-building: '#4a5570'
    map-color-roadMajor: '#5b6480'
    map-color-roadMinor: '#394053'
    map-color-roadCasing: '#0d1017'
    camera-locked: false
- type: grid
  column_span: 4
  cards:
  - type: custom:sankey-chart
    title: Energy flow
    energy_date_selection: true
    ignore_missing_entities: true
    layout: horizontal
    height: 360
    unit_prefix: k
    round: 1
    show_icons: false
    show_names: true
    show_states: true
    show_units: true
    min_box_size: 8
    min_box_distance: 8
    box_thickness: 18
    connection_margin: 6
    min_state: 0.01
    throttle: 1000
    sections:
    - min_width: 170
      sort_by: state
      sort_dir: desc
    - min_width: 150
      sort_by: none
    - min_width: 190
      sort_by: state
      sort_dir: desc
      sort_group_by_parent: true
    - min_width: 190
      sort_by: state
      sort_dir: desc
      sort_group_by_parent: true
    nodes:
    - id: sensor.solis_inverter_solar_today
      name: Solar
      section: 0
      color: var(--warning-color)
    - id: sensor.solis_inverter_grid_import_today
      name: Grid import
      section: 0
      color: var(--info-color)
    - id: sensor.solis_inverter_battery_discharge_today
      name: Battery out
      section: 0
      color: var(--success-color)
    - id: sensor.solis_inverter_house_consumption_today
      name: House
      section: 1
      color: var(--primary-color)
    - id: sensor.solis_inverter_battery_charge_today
      name: Battery in
      section: 2
      color: var(--success-color)
    - id: sensor.solis_inverter_grid_export_today
      name: Grid export
      section: 2
      color: var(--error-color)
    - id: untracked_energy
      name: Unaccounted
      section: 2
      color: var(--secondary-text-color)
      entity_id: sensor.solis_inverter_solar_today
      add_entities:
      - sensor.solis_inverter_grid_import_today
      - sensor.solis_inverter_battery_discharge_today
      subtract_entities:
      - sensor.solis_inverter_house_consumption_today
      - sensor.solis_inverter_battery_charge_today
      - sensor.solis_inverter_grid_export_today
    - id: sensor.tesla_home_charging_energy
      name: Tesla
      section: 3
      color: var(--info-color)
    - id: sensor.living_room_air_conditioner_energy_today
      name: Air con
      section: 3
      color: 'var(--cyan-color, #4dd0e1)'
    - id: rest_of_house
      type: remaining_parent_state
      name: Rest of house
      section: 3
      color: var(--primary-color)
    links:
    - source: sensor.solis_inverter_solar_today
      target: sensor.solis_inverter_grid_export_today
    - source: sensor.solis_inverter_solar_today
      target: sensor.solis_inverter_battery_charge_today
    - source: sensor.solis_inverter_solar_today
      target: sensor.solis_inverter_house_consumption_today
    - source: sensor.solis_inverter_solar_today
      target: untracked_energy
    - source: sensor.solis_inverter_grid_import_today
      target: sensor.solis_inverter_house_consumption_today
    - source: sensor.solis_inverter_grid_import_today
      target: sensor.solis_inverter_battery_charge_today
    - source: sensor.solis_inverter_grid_import_today
      target: untracked_energy
    - source: sensor.solis_inverter_battery_discharge_today
      target: sensor.solis_inverter_house_consumption_today
    - source: sensor.solis_inverter_battery_discharge_today
      target: untracked_energy
    - source: sensor.solis_inverter_house_consumption_today
      target: sensor.tesla_home_charging_energy
    - source: sensor.solis_inverter_house_consumption_today
      target: sensor.living_room_air_conditioner_energy_today
    - source: sensor.solis_inverter_house_consumption_today
      target: rest_of_house
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
      rows: 7
- type: grid
  column_span: 1
  cards:
  - type: energy-date-selection
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
  - type: energy-self-sufficiency-gauge
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
  - type: energy-solar-consumed-gauge
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: energy-distribution
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
- type: grid
  column_span: 1
  cards:
  - type: custom:modern-circular-gauge
    entity: sensor.solis_inverter_battery
    name: Battery
    unit: '%'
    min: 0
    max: 100
    show_state: true
    segments:
    - from: 0
      color:
      - 239
      - 83
      - 80
    - from: 10
      color:
      - 255
      - 183
      - 77
    - from: 50
      color:
      - 102
      - 187
      - 106
    secondary:
      entity: sensor.solis_inverter_solar_power
      show_gauge: inner
      min: 0
      max: 6000
      unit: W
      label: Solar
      state_size: small
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
- type: grid
  column_span: 4
  cards:
  - type: custom:plotly-graph
    raw_plotly_config: true
    hours_to_show: 2d
    time_offset: 1d
    refresh_interval: 60
    entities:
    - entity: sensor.solis_inverter_battery
      name: Battery SOC
      type: scatter
      mode: lines
      x: $ex xs
      y: $ex ys
      line:
        color: '#66bb6a'
        width: 2
        shape: spline
        smoothing: 0.6
      fill: tozeroy
      fillcolor: rgba(102, 187, 106, 0.12)
      hovertemplate: '%{y:.0f}%<extra>SOC</extra>'
    config:
      displayModeBar: false
      scrollZoom: false
    layout:
      height: 320
      margin:
        t: 30
        r: 20
        b: 40
        l: 45
      paper_bgcolor: rgba(0,0,0,0)
      plot_bgcolor: rgba(0,0,0,0)
      font:
        color: '#9e9e9e'
        size: 11
      title:
        text: Battery SOC — charge windows shaded
        font:
          color: '#e0e0e0'
          size: 14
      xaxis:
        gridcolor: rgba(255,255,255,0.05)
        zeroline: false
      yaxis:
        range:
        - 0
        - 100
        ticksuffix: '%'
        gridcolor: rgba(255,255,255,0.05)
        zeroline: false
        fixedrange: true
      showlegend: false
      shapes: "$fn () => {\n  const DAY = 86400e3;\n  const now = new Date();\n  const lo = now.getTime() - DAY,\
        \ hi = now.getTime() + DAY;\n  const at = (base, h, m) => { const d = new Date(base); d.setHours(h, m, 0,\
        \ 0); return d; };\n  const shapes = [];\n  for (let off = -2; off <= 1; off++) {\n    const base = new\
        \ Date(now.getTime() + off * DAY);\n    const x0 = Math.max(lo, at(base, 23, 30).getTime());\n    const\
        \ x1 = Math.min(hi, at(base, 5, 30).getTime() + DAY);\n    if (x1 <= x0) { continue; }\n    shapes.push({type:\
        \ \"rect\", xref: \"x\", yref: \"paper\", x0: x0, x1: x1,\n                 y0: 0, y1: 1, fillcolor: \"\
        rgba(79, 143, 255, 0.10)\",\n                 line: {width: 0}, layer: \"below\"});\n  }\n  shapes.push({type:\
        \ \"line\", xref: \"x\", yref: \"paper\",\n               x0: now.getTime(), x1: now.getTime(), y0: 0, y1:\
        \ 1,\n               line: {color: \"rgba(255,255,255,0.45)\", width: 1, dash: \"dot\"}});\n  return shapes;\n\
        }"
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
      rows: 6
- type: grid
  column_span: 4
  cards:
  - type: custom:plotly-graph
    raw_plotly_config: true
    hours_to_show: 504
    refresh_interval: 300
    entities:
    - entity: sensor.solis_inverter_house_load
      statistic: mean
      period: hour
      type: heatmap
      hoverongaps: false
      fn: "$fn ({ xs, ys, vars }) => {\n  const days = [];\n  const dayIndex = new Map();\n  const today = new Date();\n\
        \  today.setHours(0, 0, 0, 0);\n  for (let off = 20; off >= 0; off--) {\n    const d = new Date(today);\n\
        \    d.setDate(d.getDate() - off);\n    dayIndex.set(d.toDateString(), days.length);\n    days.push(\n \
        \     d.toLocaleDateString(undefined, { day: \"numeric\", month: \"short\" })\n    );\n  }\n  const hours\
        \ = [];\n  for (let h = 0; h < 24; h++) {\n    hours.push(String(h).padStart(2, \"0\") + \":00\");\n  }\n\
        \  const z = hours.map(() => days.map(() => null));\n  for (let i = 0; i < xs.length; i++) {\n    if (ys[i]\
        \ === null || ys[i] === undefined) { continue; }\n    const di = dayIndex.get(xs[i].toDateString());\n \
        \   if (di === undefined) { continue; }\n    z[xs[i].getHours()][di] = Math.round(+ys[i]);\n  }\n  vars.hm_x\
        \ = days;\n  vars.hm_y = hours;\n  vars.hm_z = z;\n}\n"
      x: $fn ({ vars }) => vars.hm_x
      y: $fn ({ vars }) => vars.hm_y
      z: $fn ({ vars }) => vars.hm_z
      zmin: 0
      colorscale:
      - - 0
        - '#111418'
      - - 0.3
        - '#1f4068'
      - - 0.6
        - '#2d9cdb'
      - - 0.85
        - '#f2c94c'
      - - 1
        - '#ff8a65'
      colorbar:
        thickness: 10
        outlinewidth: 0
        ticksuffix: ' W'
        tickfont:
          color: '#9e9e9e'
          size: 10
      hovertemplate: '%{x} %{y} — %{z} W<extra></extra>'
    config:
      displayModeBar: false
      scrollZoom: false
    layout:
      height: 420
      margin:
        t: 30
        r: 10
        b: 40
        l: 55
      paper_bgcolor: rgba(0,0,0,0)
      plot_bgcolor: rgba(0,0,0,0)
      font:
        color: '#9e9e9e'
        size: 11
      title:
        text: House load — hour of day × last 21 days
        font:
          color: '#e0e0e0'
          size: 14
      xaxis:
        type: category
        tickangle: -45
      yaxis:
        type: category
        autorange: reversed
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
      rows: 8
- type: grid
  column_span: 4
  cards:
  - type: custom:plotly-graph
    raw_plotly_config: true
    hours_to_show: 1d
    refresh_interval: 60
    entities:
    - entity: sensor.solis_inverter_grid_voltage
      name: Hourly max
      statistic: max
      period: hour
      type: scatter
      mode: lines
      x: $ex xs
      y: $ex ys
      line:
        width: 0
        shape: spline
        smoothing: 0.5
      hoverinfo: skip
      showlegend: false
    - entity: sensor.solis_inverter_grid_voltage
      name: Hourly range
      statistic: min
      period: hour
      type: scatter
      mode: lines
      x: $ex xs
      y: $ex ys
      line:
        width: 0
        shape: spline
        smoothing: 0.5
      fill: tonexty
      fillcolor: rgba(120, 170, 255, 0.13)
      hoverinfo: skip
      showlegend: false
    - entity: sensor.solis_inverter_grid_voltage
      name: Grid voltage
      type: scatter
      mode: lines
      x: $ex xs
      y: $ex ys
      line:
        color: '#7ab8ff'
        width: 1.6
        shape: spline
        smoothing: 0.4
      hovertemplate: '%{y:.1f} V<extra></extra>'
    config:
      displayModeBar: false
      scrollZoom: false
    layout:
      height: 300
      margin:
        t: 30
        r: 20
        b: 40
        l: 45
      paper_bgcolor: rgba(0,0,0,0)
      plot_bgcolor: rgba(0,0,0,0)
      font:
        color: '#9e9e9e'
        size: 11
      title:
        text: Grid voltage — 24 h against the statutory band
        font:
          color: '#e0e0e0'
          size: 14
      xaxis:
        gridcolor: rgba(255,255,255,0.05)
        zeroline: false
      yaxis:
        range:
        - 212.2
        - 257.0
        ticksuffix: ' V'
        gridcolor: rgba(255,255,255,0.05)
        zeroline: false
        fixedrange: true
      showlegend: false
      shapes:
      - type: rect
        xref: paper
        yref: y
        x0: 0
        x1: 1
        y0: 216.2
        y1: 253.0
        fillcolor: rgba(102, 187, 106, 0.06)
        line:
          width: 0
        layer: below
      - type: line
        xref: paper
        yref: y
        x0: 0
        x1: 1
        y0: 253.0
        y1: 253.0
        line:
          color: rgba(239, 83, 80, 0.55)
          width: 1
          dash: dash
      - type: line
        xref: paper
        yref: y
        x0: 0
        x1: 1
        y0: 216.2
        y1: 216.2
        line:
          color: rgba(239, 83, 80, 0.55)
          width: 1
          dash: dash
      annotations:
      - xref: paper
        yref: y
        x: 0.995
        y: 253.0
        text: 253.0 V
        showarrow: false
        yanchor: bottom
        font:
          color: rgba(239, 83, 80, 0.8)
          size: 10
      - xref: paper
        yref: y
        x: 0.995
        y: 216.2
        text: 216.2 V
        showarrow: false
        yanchor: top
        font:
          color: rgba(239, 83, 80, 0.8)
          size: 10
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
      rows: 6
- type: grid
  column_span: 2
  cards:
  - type: energy-usage-graph
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: energy-solar-graph
    card_mod:
      style: "ha-card {\n  background: #161616;\n  border: 1px solid rgba(255,255,255,0.06);\n  border-radius: 16px;\n\
        \  box-shadow: none;\n}\n"
    grid_options:
      columns: full
