          {% set B  = [ 0, -BP ] | max %}
          {% set C  = [ 0,  BP ] | max %}
          {% set G  = [ 0,  GP ] | max %}
          {% set E  = [ 0, -GP ] | max %}
          {% set T  = [ TR, H ] | min %}
          {% set A  = [ AR, H - T ] | min %}
          {% set Hr = [ 0, H - T - A ] | max %}
          {% set L  = [ 0, (S + B + G) - (Hr + T + A + C + E) ] | max %}
