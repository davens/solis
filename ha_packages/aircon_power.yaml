# ---------------------------------------------------------------------------
# Air con power, for the Sankey's air-con carve-out.
#
# lg_thinq publishes no power entity for the air con, only an energy_today
# counter in Wh that steps roughly once an hour and resets once a day (at about
# 00:14, not midnight). This turns each step into the average power over the
# interval it covers, and holds that until the next step.
#
# It replaced a UI `derivative` helper on 2026-10-11. That helper dropped to
# 0 W partway through every hour (LG re-sends unchanged readings, and each
# repeat counted as no change) and threw spikes up to 1.4 MW (two readings
# seconds apart). It credited 2.05 kWh to the air con on a 3.2 kWh day.
#
# - Only a changed reading counts. Two changes less than 15 minutes apart are
#   merged into the next step rather than divided by a tiny interval.
# - A drop is the daily reset. The new reading is what was used since then.
# - No step for 90 minutes (LG's cloud stalls, or HA lost the feed) reads 0,
#   which puts the air con back inside House rather than inventing a load. A
#   step more than 20 hours after the last one is not trusted (it may hide a
#   missed reset): it only re-baselines.
# - The first step after the reset divides the new reading by the whole
#   interval, so whatever was used between LG's last pre-reset reading and the
#   reset is lost. Daily totals come out slightly under LG's.
# - The value describes the interval just past, so the split lags by up to an
#   hour. Daily totals are unaffected (docs/sankey.md).
# ---------------------------------------------------------------------------

template:
  - triggers:
      - trigger: state
        entity_id: sensor.living_room_air_conditioner_energy_today
        not_to: [unavailable, unknown]
      - trigger: time_pattern
        minutes: "/5"
    # `this` is not available in block variables, so the baseline is read from
    # the sensor's own attributes. They still hold the previous update here.
    variables:
      wh: "{{ states('sensor.living_room_air_conditioner_energy_today') | float(none) }}"
      at: "{{ states.sensor.living_room_air_conditioner_energy_today.last_changed | string if wh is number else none }}"
      lw: "{{ state_attr('sensor.aircon_power', 'last_wh') }}"
      la: "{{ state_attr('sensor.aircon_power', 'last_at') }}"
      based: "{{ lw is number and la is string and as_datetime(la) is not none }}"
      hrs: "{{ (as_datetime(at) - as_datetime(la)).total_seconds() / 3600 if based and wh is number and wh != lw else 0 }}"
      step: "{{ 0.25 <= hrs <= 20 }}"
      rebase: "{{ wh is number and (step or not based or hrs > 20) }}"
      watts: >
        {% if step %}{{ (((wh - lw) if wh >= lw else wh) / hrs) | round(2) }}
        {% elif not based or hrs > 20 or (now() - as_datetime(la)).total_seconds() > 5400 %}0
        {% else %}{{ states('sensor.aircon_power') | float(0) }}{% endif %}
    sensor:
      - name: "Aircon power"
        unique_id: aircon_power_from_energy_today
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ watts }}"
        attributes:
          last_wh: "{{ wh if rebase else lw }}"
          last_at: "{{ at if rebase else la }}"
